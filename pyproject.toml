[project]
name = "testgram"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11.13",
    "pyyaml>=6.0.2",
]

[project.scripts]
testgram = "testgram.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["testgram*"]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 88
